<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="imc.css">
</head>
<body>
    <div>
        <h1>Body Mass Index (BMI) Calculator</h1>
        <p></p>BMI under 18.5-underweight<br>BMI between 18.5 and 24.9-healthy weight<br>
        BMI between 24.9 and 29.9-overweight<br>BMI over or equal to 30-obese</p>
        <div id="input-box">
            <label for="weight">Weight</label>
            <select id="weight-unit" name="weight-unit">
                <option value="kg">kg:</option>
                <option value="lb">lb:</option>
            </select>
            <input type="number" id="weight" name="weight" required>
            <label for="height">Height</label>
            <select id="height-unit" name="height-unit">
                <option value="cm">cm:</option>
                <option value="m">meters:</option>
                <option value="feet">feet:</option>
            </select>
            <input type="number" id="height" name="height" step="0.01" required>
        </div>
        <div id="output-box">
            <label for="bmi">Your BMI:</label>
            <input type="text" id="bmi" readonly>
            <button class="btn_operator2" onclick="calculateBMI()">Calculate BMI</button>
        </div>
    </div>
    <script src="imc-code.js"></script>
</body>
</html>
